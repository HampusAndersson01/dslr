name: Build DSLR AI Coach APK

on:
  push:
    branches: [build/dslr-ai-coach]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Vendor Nikon PTP engine
        run: |
          git clone --depth 1 https://github.com/michaelzoech/remoteyourcam-usb.git /tmp/remoteyourcam
          mkdir -p app/src/main/java/com/remoteyourcam/usb/ptp
          rsync -a --exclude='PtpUsbService.java' --exclude='WorkerNotifier.java' /tmp/remoteyourcam/src/com/remoteyourcam/usb/ptp/ app/src/main/java/com/remoteyourcam/usb/ptp/
          cp /tmp/remoteyourcam/LICENSE REMOTEYOURCAM-LICENSE.txt || true

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Stage APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/DSLR-AI-Coach-v0.1-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DSLR-AI-Coach-APK
          path: out/DSLR-AI-Coach-v0.1-debug.apk
          if-no-files-found: error
